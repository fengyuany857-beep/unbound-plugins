name: Translate V2 Inline

on:
  push:
    branches:
      - translate-v2
      - translate-v2-byok
      - translate-v2.3-inline
      - translate-v2.3.1-safe-inline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install dependencies
        run: bun install
      - name: Type check stable core
        run: bunx --package typescript@5.9.3 tsc -p plugins/translate/tsconfig.core.json --noEmit
      - name: Test
        working-directory: plugins/translate
        run: bun test
      - name: Build
        working-directory: plugins/translate
        run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: translate-v2.3-inline-dist
          path: plugins/translate/dist
          if-no-files-found: error
